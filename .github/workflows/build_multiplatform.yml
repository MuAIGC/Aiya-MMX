name: 多平台加密编译

on: 
  workflow_dispatch:  # 手动触发
  push:
    tags:
      - 'v*'  # 或打标签时自动触发

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-20.04, windows-latest, macos-latest]
        python-version: ['3.10']
        include:
          # 定义各平台输出文件名
          - os: ubuntu-20.04
            platform: linux
            ext: so
          - os: windows-latest
            platform: win
            ext: pyd
          - os: macos-latest
            platform: mac
            ext: so

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cython setuptools
        
    - name: Build encrypted modules
      run: |
        python encrypt_all.py
        
    - name: Clean up
      shell: bash
      run: |
        rm -rf nodes_backup build dist *.egg-info
        find nodes -name "*.py" ! -name "__init__.py" -type f -delete 2>/dev/null || true
        find nodes -name "*.c" -type f -delete 2>/dev/null || true
        
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: ComfyUI-AiyaMMX-${{ matrix.platform }}-${{ matrix.python-version }}
        path: |
          .
          !.git/
          !nodes_backup/
          !__pycache__/

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v3
      
    - name: Zip packages
      run: |
        for dir in ComfyUI-AiyaMMX-*/; do
          zip -r "${dir%/}.zip" "$dir"
        done
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: ComfyUI-AiyaMMX-*.zip
        body: |
          多平台加密版本
          - Linux: Python 3.10
          - Windows: Python 3.10  
          - MacOS: Python 3.10
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
